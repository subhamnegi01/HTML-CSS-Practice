<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Web</title>
    <link rel="stylesheet" href="01blog.css">
</head>
<body class="body_container">

    <div class="container">
        <header class="header_container">
            <h1 class="header_title">Web Development</h1>
            <p class="header_desc">Utilize this space to incoprate a captiving subheading crafted by chatGPt, adding depth and intrigue to your blog.</p>
        </header>
    </div>

    <main class="main_container">
        <!-- card 1 start from here  -->

        <div class="card_container">
            <a href="#" class="card_image_container">
                <img src="iphone.webp" alt="" class="card_image" loading="lazy">
            </a>

            <div class="card_title_container">
                <a href="#" class="card_title_anchor">
                    <h2 class="card_title">New Gadgets Released</h2>
                </a>
                <p class="card_desc">Check out the latest tech gadgets hitting the market, from iphone to iphone.</p>
            </div>
            <div class="card_footer_container">
                <div class="author_container">
                    <div class="author_avatar_container">
                        <img src="Apple-Music-Logo-PNG.pn"
                        loading="lazy" class="author_avtar" alt="">
                        <div class="author_info_container">
                            <span>
                                John Doe
                            </span>

                            <span>
                                Sept 19, 2026
                            </span>

                        </div>
                    </div>

                </div>
                <div class="card_tag_container">
                    <span>Technology</span>
                </div>
            </div>
        </div>

        <!-- card 1 ends here -->
    </main>

</body>
</html>
