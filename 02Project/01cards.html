<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cards</title>

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .container{
            width: 100vw;
            height: 100vh;
            border: 1px solid black;
            background: #020024;
            background: linear-gradient(90deg, rgba(2, 0, 36, 1) 0%, rgba(37, 148, 179, 1) 0%, rgba(111, 225, 247, 1) 34%, rgba(227, 255, 171, 1) 96%);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .card{
            width: 400px;
            height: 650px;
            background-color: aliceblue;
            border-radius: 20px;

            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            padding: 20px;
        }
        .card img{
            width: 95%;
            border-radius: 50px;
        }

        .card h2{
            font-weight: bold;
            font-size: 28px;
        }
        .card p{
            font-size: 20px;
            font-weight: 400;
        }
    </style>
</head>
<body>
    

<div class="container">

    <div class="card">
        <img src="FB_IMG_1685393717308.jpg" >
        <h2>Chennai Super Kings five times champion of IPL.</h2>
        <p>Lorem ipsum, dolor sit amet consectetur adipisicing elit. Debitis animi enim expedita dolor modi et? Lorem ipsum dolor sit.</p>
    </div>
</div>

</body>
</html>
