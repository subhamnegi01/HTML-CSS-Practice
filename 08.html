<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    .container{
        border: 2px solid black;
        background-color: antiquewhite;
        display: flex;
        flex-direction: row;
        width: 400px;

    }
    #boxleft{
        background-color: aqua;
        border:1px solid rgb(42, 254, 5);
        width: 48%;
        margin: 3px;
        padding: 2px;
        display: flex;
        flex-direction: column;
    }
    #boxright{
        background-color: rgb(99, 123, 196);
        border: 1px solid rgb(15, 12, 12);
        width: 48%;
    }
    p{
        border-color: 2px solid rgb(207, 142, 142);
    }
    img{
        width: 200px;
    }
    @media(max-width:640px){
        .container{
            flex-direction: column;
        }
    }
    
</style>
</head>

<body>
    <div class="container">

        <div id="boxleft">
            <p>Text1</p>
            <p>Text2</p>
        </div>

        <div id="boxright">
            <img src="images (2).jpeg"  />
        </div>
    </div>
</body>
</html>
