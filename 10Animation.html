<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;

        }
        .container{
            width: 2500px;
            height: 1000px;
            background-color: rgb(227, 227, 233);
            border: 5px solid black;
        }
        .box{
            width: 350px;
            height: 80px;
            background-color: aquamarine;
            border-radius: 10px;
            border: 1px solid red;
            margin: 10px;
            position: relative;
            animation-name: rightMovement;
            animation-duration: 5s;
            animation-iteration-count: infinite;
            animation-delay: 1s;
            animation-timing-function: cubic-bezier(0.075, -0.82, 0.165, 1);
            animation-direction: alternate;
        }
        @keyframes rightMovement{
            from{
                top: 0;
                left: 0;
            }
            to{
                top: 0;
                left: 2000px;
            }
        }
        #box2{
            width: 350px;
            height: 80px;
            background-color: aquamarine;
            border-radius: 10px;
            border: 1px solid red;
            margin: 10px;
            position: relative;
            animation: 5s linear 1s infinite alternate none running leftMovement;

        }
        @keyframes leftMovement{
            from{
                top: 800px;
                left: 2000px;
            }
            to{
                top: 800px;
                left: 0px;
            }
        }

        #circle{
            width: 100px;
            height: 100px;
            background-color: aquamarine;
            border-radius: 50px;
            border: 1px solid red;
            margin: 10px;
            position: relative;
            top: 240px;
            left: 675px;
            animation: 10s ease-in-out 0s infinite alternate-reverse none running circleMovement;
        }

        @keyframes circleMovement{
            0%{
                top: 1%;
                left: 5%;
            }
            30%{
                top:5%;
                left: 90%;
            }
            60%{
                top: 60%;
                left: 10%;
            }
            100%{
                top: 60%;
                left: 70%;

            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="box">

        </div>
        <div id="box2"></div>
        <div id="circle"> </div>
    </div>

</body>
</html>
